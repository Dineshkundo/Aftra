apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailservice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    run: {{ include "mailservice.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ include "mailservice.name" . }}
