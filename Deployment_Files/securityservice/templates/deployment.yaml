apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "securityservice.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "securityservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "securityservice.labels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "securityservice.labels" . | nindent 8 }}
    spec:
      containers:
        - name: securityserviceapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: spring.profiles.active
              value: {{ .Values.env.profile }}
            - name: env
              value: {{ .Values.env.name }}
