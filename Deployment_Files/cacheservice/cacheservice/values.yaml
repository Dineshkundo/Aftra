replicaCount: 1

image:
  repository: codaregistry.azurecr.io/cacheservice
  tag: "ENVIRONMENT-BUILD_NUMBER"
  pullPolicy: Always

resources:
  requests:
    memory: "6Gi"
    cpu: "1000m"
  limits:
    memory: "18Gi"
    cpu: "6000m"

env:
  springProfile: dev
  environment: dev

nodeSelector:
  pool: cacheservice

tolerations:
  - key: "app"
    operator: "Equal"
    value: "cacheservice"
    effect: "NoSchedule"

service:
  type: ClusterIP
  port: 8084

revisionHistoryLimit: 3
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0